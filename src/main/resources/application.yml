server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: mcd-combo-recommender
  profiles:
    # 默认激活 dev；如需覆盖数据库密码，在本地创建 application-local.yml
    # 并以 --spring.profiles.active=dev,local 启动即可
    active: dev
  # 本地覆盖文件（不存在则自动忽略，不影响正常启动）
  config:
    import: optional:classpath:application-local.yml
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mcd.recommender.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 接口文档
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 默认分组
      paths-to-match: /**
      packages-to-scan: com.mcd.recommender.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 数据模型

# 认证配置
auth:
  # 令牌有效期（秒），默认 2 小时
  token-expire-seconds: 7200

# 推荐引擎配置
recommender:
  # 返回给前端的推荐结果数量
  top-n: 5
  # 各策略权重（加权求和得到最终得分）
  weights:
    budget: 1.0      # 预算匹配
    taste: 1.2       # 口味匹配
    people: 1.0      # 人数适配
    time-slot: 0.8   # 时段适配
    popularity: 0.6  # 人气热度
    diversity: 0.4   # 多样性/新鲜感

logging:
  level:
    root: info
    com.mcd.recommender: debug
